[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Environment variables for production
# Set these in your Netlify dashboard under Site settings > Environment variables
[context.production.environment]
  # CONTACT_FORM_WEBHOOK_URL = "your-contact-webhook-url-here"
  # NEWSLETTER_WEBHOOK_URL = "your-newsletter-webhook-url-here"
  # CHATBOT_WEBHOOK_URL = "your-chatbot-webhook-url-here"

# Environment variables for deploy previews
[context.deploy-preview.environment]
  # CONTACT_FORM_WEBHOOK_URL = "your-staging-contact-webhook-url-here"
  # NEWSLETTER_WEBHOOK_URL = "your-staging-newsletter-webhook-url-here"
  # CHATBOT_WEBHOOK_URL = "your-staging-chatbot-webhook-url-here"

# Environment variables for branch deploys
[context.branch-deploy.environment]
  # CONTACT_FORM_WEBHOOK_URL = "your-staging-contact-webhook-url-here"
  # NEWSLETTER_WEBHOOK_URL = "your-staging-newsletter-webhook-url-here"
  # CHATBOT_WEBHOOK_URL = "your-staging-chatbot-webhook-url-here"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

  # --- Default cache (HTML) - 1 hour cache, must revalidate after ---
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Images ---
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Fonts ---
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.eot"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- HTML - 1 hour cache, must revalidate after ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# NOTE: SPA fallback redirect removed - this is a static site, not a SPA
# All unmatched routes will return 404 (proper SEO behavior)

# Security headers for forms
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
